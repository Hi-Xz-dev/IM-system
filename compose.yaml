services:
  im:
    build: .
    environment:
      TCP_HOST: 0.0.0.0
      HTTP_HOST: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_USER: im
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      RABBITMQ_URL: amqp://im:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: im_system
      MYSQL_USER: im
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          -e 'SELECT 1 FROM messages LIMIT 0'
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: im
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 12

volumes:
  mysql-data:
  rabbitmq-data:
